fixture_version: mha_bedrock_v1
seed: 42
# POC: init weights → native infer on x_test → stream to Loom → compare outputs (no training loop).
train_samples: 64
test_samples: 100
max_seq_len: 8
max_d_model: 16
output_dim: 32
epochs: 0
batch_size: 32
learning_rate: 0.01

engines:
  - id: pytorch
    enabled: true
  - id: tensorflow
    enabled: true
  - id: jax
    enabled: true

# Single causal MHA blocks (Loom semantics: RoPE + causal mask).
models:
  - id: mha_8_2_4
    d_model: 8
    num_heads: 2
    seq_len: 4

  - id: mha_16_2_8
    d_model: 16
    num_heads: 2
    seq_len: 4

  - id: mha_16_4_4
    d_model: 16
    num_heads: 4
    seq_len: 4

  - id: mha_8_4_8
    d_model: 8
    num_heads: 4
    seq_len: 8
