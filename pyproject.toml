[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "planetbridging"
version = "0.7.0"
description = "Stream live AI engine weights into Loom .entity checkpoints — no HTTP required"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "OpenFluke" }]
keywords = ["loom", "ml", "pytorch", "tensorflow", "jax", "entity", "model-bridge"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6",
]

[project.optional-dependencies]
pytorch = ["torch", "safetensors"]
tensorflow = ["tensorflow"]
jax = ["jax", "flax"]
sklearn = ["scikit-learn"]
dev = ["pytest>=7"]
all = ["planetbridging[pytorch,tensorflow,jax,sklearn,dev]"]

[project.urls]
Homepage = "https://github.com/openfluke/planetbridging"

[tool.hatch.build.targets.wheel]
packages = ["src/planetbridging"]

[tool.hatch.build.targets.sdist]
include = ["src/planetbridging", "pyproject.toml", "README.md", "examples", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "pytorch: needs torch",
  "tensorflow: needs tensorflow",
]
