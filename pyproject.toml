[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "planetbridging"
version = "0.7.3"
description = "Stream live AI engine weights into Loom .entity checkpoints — no HTTP required"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "OpenFluke" }]
keywords = ["loom", "ml", "pytorch", "tensorflow", "jax", "entity", "model-bridge"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6",
]

[project.optional-dependencies]
pytorch = ["torch", "safetensors"]
tensorflow = ["tensorflow"]
jax = ["jax", "flax"]
sklearn = ["scikit-learn"]
dev = ["pytest>=7"]
welvet = ["welvet"]
all = ["planetbridging[pytorch,tensorflow,jax,sklearn,welvet,dev]"]

[project.urls]
Homepage = "https://github.com/openfluke/planetbridging"

[tool.hatch.build.targets.wheel]
packages = ["src/planetbridging"]

[tool.hatch.build.targets.wheel.force-include]
"bundle/_data" = "planetbridging/_data"
"bundle/_bin" = "planetbridging/_bin"
"examples" = "planetbridging/examples"

[tool.hatch.build.targets.sdist]
# bundle/ is gitignored; staged before publish via scripts/prepare_pypi_bundle.sh
ignore-vcs = true
include = [
  "src/planetbridging",
  "bundle",
  "pyproject.toml",
  "README.md",
  "LICENSE",
  "examples",
  "tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "pytorch: needs torch",
  "tensorflow: needs tensorflow",
]
